events {}
http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://api:3000;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;    # Vite HMR websocket (dev-only)
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
