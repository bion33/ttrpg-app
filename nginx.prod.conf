events {}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  gzip             on;
  gzip_types       text/css application/javascript application/json image/svg+xml;
  gzip_min_length  1024;

  server {
    listen 80;
    root   /usr/share/nginx/html;        # the built dist/ mounted into this container

    location /api/ {
      proxy_pass http://ttrpg_api:3100;  # same-origin backend relay
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {                   # Vite's content-hashed bundle output
      try_files $uri =404;
      expires    1y;
      add_header Cache-Control "public, immutable";
    }

    location / {                          # SPA: fall back to index.html so client routing works on refresh
      try_files $uri $uri/ /index.html;
    }
  }
}
