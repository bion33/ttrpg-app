approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# The drag-handle extension declares Yjs collaboration modules as peers, but this
# app has no live collaboration and aliases both to stubs (src/shims/, vite.config.ts),
# so they are genuinely optional here.
packageExtensions:
  "@tiptap/extension-drag-handle@*":
    peerDependenciesMeta:
      "@tiptap/extension-collaboration":
        optional: true
      "@tiptap/y-tiptap":
        optional: true
  # extension-floating-menu requires @floating-ui/dom as a peer that @tiptap/react
  # does not forward; provide it so the (already-installed) peer is genuinely satisfied.
  "@tiptap/react@*":
    dependencies:
      "@floating-ui/dom": "^1.8.0"
