<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 239">
    <!-- Ring outline of the proficiency dot marker. Outer boundary traced
         from character-sheet.svg (id217). Inner boundary scaled from
         id217's own circle (about the shared center) to cut id217's raw
         26-unit ring thickness down to ~17.3 units (2/3): at rendered size
         the raw thickness ratios put this ring visibly heavier than even
         DiamondCheckbox's outline (id187) at its thinnest, so this value
         is calibrated to visual comparison rather than the source ratio.
         Rendered filled with the evenodd rule so the inner hole reveals
         proficiency-checkbox-mark.svg beneath it. -->
    <path
        fill-rule="evenodd"
        d="M 121,238 C 57,238 0,185 0,120
           0,57 57,0 121,0
           184,0 237,57 237,120
           237,185 184,238 121,238 Z
           M 121,220 C 66,220 17,175 17,120
           17,66 66,18 121,18
           174,18 220,66 220,120
           220,175 174,220 121,220 Z"
    />
</svg>
